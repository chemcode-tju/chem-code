<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结构与轨迹 · Chem Code</title><link rel="icon" href="/assets/favicon.svg?v=cat-02" type="image/svg+xml"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/structure/style.css"><link rel="stylesheet" href="/assets/structure/shell-theme.css"><link rel="stylesheet" href="/assets/choices.css">
  <script type="module" src="/assets/choices.mjs"></script>
  <link rel="stylesheet" href="/assets/solid-glass.css">
</head>
<body>
<main>
  <header><h1 id="filename" data-empty-title>结构与轨迹</h1>
    <nav class="header-tools" aria-label="查看器工具">
      <details id="file-menu" class="header-menu"><summary role="button" title="文件" aria-label="文件" aria-controls="file-card"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-folder"/></svg></summary>
        <section id="file-card" class="tool-card" aria-label="文件选项"><h2>文件</h2>
          <div class="card-actions"><a href="/" class="back-link">返回研究空间</a><button data-close-menu id="open-file"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-folder"/></svg>本地文件</button></div><input id="file-picker" type="file" multiple hidden>
          <label class="card-field">格式识别 <select id="import-format"><option value="auto">自动识别</option><option value="extxyz">XYZ / extxyz</option><option value="vasp">POSCAR / CONTCAR</option><option value="vasp-xdatcar">XDATCAR</option><option value="lammps-dump-text">LAMMPS dump（文本）</option><option value="lammps-data">LAMMPS data</option><option value="gromacs">GROMACS GRO</option><option value="proteindatabank">PDB</option><option value="cif">CIF</option></select></label>
          <div class="card-actions card-divider"><button data-close-menu id="source-toggle"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-software"/></svg>源码</button></div>
        </section>
      </details>
      <details id="view-menu" class="header-menu"><summary role="button" title="显示" aria-label="显示" aria-controls="view-card"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-appearance"/></svg></summary>
        <section id="view-card" class="tool-card" aria-label="显示选项"><h2>显示</h2>
          <label class="card-field">显示方式 <select id="style" aria-label="显示方式"><option value="sphere">原子球</option><option value="ballstick">球棍</option><option value="stick">线棒</option></select></label>
          <label class="card-field">原子配色 <select id="palette" aria-label="原子配色"><option value="jmol">Jmol</option><option value="rasmol">RasMol / CPK</option><option value="vesta">VESTA</option></select></label>
          <label class="card-field">原子半径比例 <select id="radius-scale" aria-label="原子半径比例" title="原子半径比例"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select></label>
          <div class="card-checks card-divider"><label><input id="cell" type="checkbox" checked>晶胞</label><label><input id="labels" type="checkbox">序号</label><label><input id="hbonds" type="checkbox">氢键</label><label><input id="wrap" type="checkbox">Wrap</label></div>
          <div class="card-actions card-divider"><button data-close-menu id="display-settings"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-appearance"/></svg>显示设置</button><button data-close-menu id="drift-settings" disabled><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-drift"/></svg>质心漂移校正</button></div>
        </section>
      </details>
      <details id="export-menu" class="header-menu"><summary role="button" aria-disabled="true" tabindex="-1" title="导出" aria-label="导出" aria-controls="export-card"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-snapshot"/></svg></summary>
        <section id="export-card" class="tool-card" aria-label="导出选项"><h2>导出</h2>
          <div class="card-actions"><button data-close-menu id="snapshot" disabled><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-snapshot"/></svg>快照</button></div>
        </section>
      </details>
      <details id="interface-settings" class="header-menu"><summary role="button" title="界面设置" aria-label="界面设置" aria-controls="settings-card"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-settings"/></svg></summary>
        <section id="settings-card" class="tool-card" aria-label="界面设置"><h2>界面设置</h2>
          <label class="card-field">主题 <select id="theme-mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
          <label class="card-field">界面字号 <select id="theme-size"><option value="14">14</option><option value="16">16</option><option value="18">18</option><option value="20">20</option></select></label>
          <label class="card-field language-control" data-no-i18n>Language <select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
        </section>
      </details>
    </nav>
  </header>
  <div id="status" role="alert" hidden></div>
  <div id="viewports" class="viewports" data-layout="single" data-mode="rotate"><section id="atom-panel" hidden><strong id="atom-title"></strong><output id="measurement"></output><span id="atom-list"></span><button id="clear-selection" disabled>清除选择</button></section><button id="open-empty" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-folder"/></svg>打开结构文件</button></div>

  <section id="source-panel" hidden><div class="section-head"><strong id="source-title">当前帧源码</strong></div><textarea id="source" readonly spellcheck="false" aria-label="当前结构源码"></textarea></section>
  <footer>
    <section id="structure-inspector" hidden aria-label="结构信息">
      <div class="inspector-heading"><div role="tablist" aria-label="结构信息分类">
        <button id="particles-tab" role="tab" aria-selected="true" aria-controls="inspector-content" data-inspector-tab="particles">粒子</button>
        <button id="types-tab" role="tab" aria-selected="false" aria-controls="inspector-content" data-inspector-tab="types" tabindex="-1">类型</button>
        <button id="cell-tab" role="tab" aria-selected="false" aria-controls="inspector-content" data-inspector-tab="cell" tabindex="-1">晶胞</button>
      </div><span id="inspector-frame"></span><button id="inspector-close" aria-label="关闭结构信息" title="关闭结构信息"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-close"/></svg></button></div>
      <div class="inspector-filters"><input id="particle-filter" type="search" placeholder="筛选原子…" aria-label="筛选粒子"><label><input id="inspector-selected" type="checkbox">仅选中</label>
        <select id="cell-mode" aria-label="晶胞显示方式" hidden><option value="vectors">晶胞向量</option><option value="parameters">晶胞参数</option></select>
        <span id="inspector-count" data-no-i18n></span>
        <button id="inspector-previous" aria-label="上一页" title="上一页"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-chevron-left"/></svg></button><button id="inspector-next" aria-label="下一页" title="下一页"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-chevron"/></svg></button>
      </div>
      <div id="inspector-content" role="tabpanel" aria-labelledby="particles-tab" tabindex="0"></div>
      <details id="structure-notes"><summary>读取说明</summary><p id="import-note"></p><p id="inspector-note"></p></details>
    </section>
    <div id="trajectory-toolbar" class="bottom-toolbar">
      <div id="trajectory-tools">
        <div class="ruler"><div id="ticks" aria-hidden="true"></div><input id="timeline" type="range" min="0" max="0" value="0" aria-label="轨迹帧滑块" disabled><button type="button" id="trajectory-toggle" aria-expanded="true" aria-controls="trajectory-tools" aria-label="收起轨迹工具" title="收起轨迹工具"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-chevron"/></svg></button></div>
        <div class="transport"><div class="playback" role="group" aria-label="轨迹播放"><button type="button" id="first" aria-label="第一帧" title="第一帧"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-first"/></svg></button>
          <button type="button" id="previous" aria-label="上一帧" title="上一帧"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-previous"/></svg></button>
          <button type="button" id="play" aria-label="播放轨迹" title="播放轨迹"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-play"/></svg></button>
          <button type="button" id="next" aria-label="下一帧" title="下一帧"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-next"/></svg></button>
          <button type="button" id="last" aria-label="最后一帧" title="最后一帧"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-last"/></svg></button>
</div>
          <div class="frame-tools"><div class="frame-label"><input id="frame-number" type="number" min="1" value="1" aria-label="帧号"><span aria-hidden="true">/</span><span id="frame-total">—</span></div><details id="playback-menu" class="bottom-menu"><summary id="playback-settings" role="button" title="播放设置" aria-label="播放设置"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-speed"/></svg></summary>
        <section id="playback-dialog" class="tool-card"><h2>播放设置</h2>
          <label class="card-field">每秒帧数 <input id="animation-fps" type="number" min="1" max="120" step="1" value="60"></label>
          <label class="card-field">播放速度 <select id="playback-speed"><option value="0.25">× 0.25</option><option value="0.5">× 0.5</option><option value="1" selected>× 1</option><option value="2">× 2</option><option value="5">× 5</option><option value="10">× 10</option><option value="20">× 20</option></select></label>
          <label class="card-field">帧步长 <input id="playback-step" type="number" min="1" max="10000" step="1" value="1"></label>
          <label class="check-row"><input id="playback-loop" type="checkbox" checked>循环播放</label>
        </section></details></div>
        </div>
      </div>
      <div class="view-tools"><div class="navigation" role="group" aria-label="视图操作"><button type="button" id="rotate" data-mode-button="rotate" aria-pressed="true" aria-label="旋转" title="旋转"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-rotate"/></svg></button>
          <button type="button" id="pan" data-mode-button="pan" aria-pressed="false" aria-label="平移" title="平移"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-pan"/></svg></button>
          <button type="button" id="zoom" data-mode-button="zoom" aria-pressed="false" aria-label="缩放" title="缩放"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-zoom"/></svg></button>
          <button type="button" id="select" data-mode-button="select" aria-pressed="false" aria-label="选择原子" title="选择原子"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-cursor"/></svg></button>
          <button type="button" id="box" data-mode-button="box" aria-pressed="false" aria-label="框选原子" title="框选原子"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-box"/></svg></button>
          <button type="button" id="reset" aria-label="适应视图" title="适应视图"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-fit"/></svg></button>
</div>
        <div class="view-rail"><details id="viewport-menu" class="bottom-menu"><summary role="button" title="视图" aria-label="视图"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-multi-view"/></svg></summary>
          <section class="tool-card"><h2>视图</h2><div id="view-control-fields"><span class="orientation-control"><select id="orientation" aria-label="视图方向">
            <option value="xy" data-shortcut="Z" aria-label="Top · XY (+Z)">Top · XY</option>
            <option value="bottom" data-shortcut="⌥Z" aria-label="Bottom · XY (−Z)">Bottom · XY</option>
            <option value="back" data-shortcut="Y" aria-label="Back · XZ (+Y)">Back · XZ</option>
            <option value="xz" selected data-shortcut="⌥Y" aria-label="Front · XZ (−Y)">Front · XZ</option>
            <option value="right" data-shortcut="X" aria-label="Right · YZ (+X)">Right · YZ</option>
            <option value="yz" data-shortcut="⌥X" aria-label="Left · YZ (−X)">Left · YZ</option>
            <option value="perspective">Perspective</option>
          </select><kbd id="orientation-key" class="view-shortcut" aria-hidden="true">⌥Y</kbd></span><select id="layout" aria-label="视图布局"><option value="single">单视图</option><option value="dual">双视图</option><option value="quad">四视图</option></select></div>
            <label class="card-field compact-navigation">鼠标操作 <select id="navigation-mode"><option value="rotate">旋转</option><option value="pan">平移</option><option value="zoom">缩放</option><option value="select">选择原子</option><option value="box">框选原子</option></select></label>
            <div class="card-actions"><button class="compact-navigation" id="view-reset">适应视图</button><button type="button" id="expand" aria-label="展开 / 恢复多视图" title="展开 / 恢复多视图"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-expand"/></svg><span>展开 / 恢复多视图</span></button></div>
          </section></details>
          <button id="inspector-toggle" title="结构信息" aria-label="结构信息" aria-expanded="false" aria-controls="structure-inspector"><svg class="icon" aria-hidden="true"><use href="/assets/ui-icons.svg#i-info"/></svg></button>
        </div>
      </div>
    </div>
  </footer>
</main>
<dialog id="drift-dialog" class="floating-panel"><h2>质心漂移校正</h2><fieldset>
<label class="check-row"><input id="drift-enabled" type="checkbox">启用校正</label>
<label>参考帧<input id="drift-reference" type="number" min="1" value="1"></label>
<label>计算范围<select id="drift-source"><option value="all">全部原子</option><option value="indices">指定原子</option></select></label>
<label>原子序号<input id="drift-atoms" placeholder="1, 3, 5-12"></label>
<button id="drift-use-selection">填入当前选择</button><output id="drift-state" hidden></output>
</fieldset>
<output id="drift-error" role="alert"></output><div class="dialog-actions"><button id="drift-close">关闭</button><button id="drift-apply">应用</button></div></dialog>

<dialog id="display-dialog" class="floating-panel">
  <h2>显示设置</h2>
  <fieldset><legend>元素显隐</legend><div id="element-list"></div><button id="show-elements">全部显示</button></fieldset>
  <fieldset><legend id="selection-count">选中原子</legend>
    <label>显示方式 <select id="selection-style"><option value="">保持原样</option><option value="sphere">原子球</option><option value="ballstick">球棍</option><option value="stick">线棒</option></select></label>
    <label>配色 <select id="selection-palette"><option value="">保持原样</option><option value="jmol">Jmol</option><option value="rasmol">RasMol / CPK</option><option value="vesta">VESTA</option><option value="custom">自定义</option></select><input id="selection-color" type="color" value="#38a5dd" aria-label="选中原子颜色"></label>
    <label>显隐 <select id="selection-visible"><option value="">保持原样</option><option value="show">显示</option><option value="hide">隐藏</option></select></label>
    <button id="apply-display">应用</button><button id="reset-selected-style">重置选中</button>
  </fieldset>
  <div class="dialog-actions"><button id="reset-display">全部重置</button><button id="display-close">关闭</button></div>
</dialog>
<dialog id="snapshot-dialog">
  <h2>保存快照</h2>
  <div class="snapshot-preview"><img id="snapshot-preview" alt="当前构型快照" hidden></div>
  <div class="export-fields"><label>文件名 <input id="snapshot-name" value="structure" maxlength="80"></label><label>格式 <select id="snapshot-format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="pdf">PDF</option></select></label>
  <label>DPI <select id="snapshot-dpi"><option value="96">96</option><option value="150">150</option><option value="300" selected>300</option><option value="600">600</option></select></label>
  <label class="check-row"><input id="snapshot-transparent" type="checkbox" checked>透明背景</label><label class="check-row"><input id="snapshot-crop" type="checkbox">裁去四周空白</label></div>

  <output id="snapshot-result"></output><div class="dialog-actions"><button id="snapshot-close">关闭</button><button id="snapshot-save">保存</button></div>
</dialog>

<script src="/assets/structure/i18n.js?v=locale-20261117"></script>
<script src="/assets/structure/vendor/3Dmol-min.js"></script>
<script src="/assets/structure/parser.js"></script>
<script src="/assets/structure/appearance.js"></script>
<script src="/assets/structure/geometry.js"></script>
<script src="/assets/structure/ase-traj.js"></script>
<script src="/assets/structure/vasp-stream.js"></script>
<script src="/assets/structure/trajectory-store.js"></script>
<script src="/assets/structure/browser-trajectory.js"></script>
<script src="/assets/structure/snapshot.js"></script>
<script src="/assets/structure/selection.js"></script>
<script src="/assets/structure/scene.js"></script>
<script src="/assets/structure/viewport.js"></script>
<script src="/assets/structure/controls.js"></script>
<script src="/assets/structure/lammps-metadata.js"></script>
<script src="/assets/structure/md-stream.js"></script>
<script src="/assets/structure/import.js?v=viewer-chrome-20261117"></script>
<script src="/assets/structure/inspector.js?v=locale-20261117"></script>
<script src="/assets/structure/app.js"></script>
<script src="/assets/structure/embed.js"></script>
</body></html>
